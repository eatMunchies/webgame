# Serves the Godot web export. The game server is a separate service; the proxy in front
# routes /ws to it, so this only ever sees requests for files.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Send the .gz copies made at build time when the browser accepts gzip.
    gzip_static on;

    location / {
        # Godot's file names are the same in every build, so a cached index.js could be paired
        # with a newer index.wasm after a deploy. no-cache makes the browser check with the
        # server each load: an unchanged file costs a tiny 304 reply, a changed one downloads.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
