[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*, addons/gdUnit4/*"
export_path="build/web/index.html"

[preset.0.options]
variant/extensions_support=true
variant/thread_support=false
html/experimental_virtual_keyboard=true
html/head_include="<style>
/* iOS zooms the page into a text box with a font under 16px when it gets focus. */
input, textarea { font-size: 16px; }
</style>
<script>
// iOS only opens the on-screen keyboard when a text box is focused during a tap. Godot focuses
// its hidden box (shown with display: block) a frame after the tap, so iOS ignores that; focus
// it again when the finger lifts, which iOS counts as part of the tap.
document.addEventListener('touchend', function () {
	document.querySelectorAll('input, textarea').forEach(function (box) {
		if (box.style.display === 'block' && document.activeElement !== box) {
			box.focus();
			var end = box.value.length;
			try { box.setSelectionRange(end, end); } catch (e) {}
		}
	});
}, true);
</script>"
