[package]
name = "webgame-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
rand = "0.10.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["full"] }
webgame-game = { version = "0.1.0", path = "../webgame-game" }
webgame-protocol = { version = "0.1.0", path = "../webgame-protocol" }

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio-tungstenite = "0.30.0"
